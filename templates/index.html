<div style="text-align: center;">
    <h1>Welcome to Dangerous Writing App</h1>
    <h2>If you stop writing, &nbsp after 5 seconds, &nbsp your writing would be erased!</h2>
</div>

<div class="textarea">
<textarea name="" id="textarea"  style=""></textarea>
</div>


<script type="text/javascript">
    let timeout;
    myTextarea = document.querySelector('#textarea');
    function checkTimeout(){
    clearTimeout(timeout)
    timeout = setTimeout(function(){
    myTextarea.value = ""
    }, 3000)
    }
   myTextarea.addEventListener('keyup', checkTimeout)
</script>
